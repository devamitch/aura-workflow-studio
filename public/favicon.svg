<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="studioGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="studioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="30" fill="#0F172A"/>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="#1E293B" stroke-width="2"/>
  
  <g filter="url(#studioGlow)">
    <!-- Connecting Workflow Bezier Curves -->
    <path d="M30 40 C50 40, 50 60, 70 60 C85 60, 85 80, 90 80" fill="none" stroke="url(#studioGrad)" stroke-width="3" stroke-dasharray="6 3"/>
    
    <!-- Visual Pipeline Orchestration Nodes -->
    <rect x="22" y="30" width="20" height="20" rx="6" fill="#6366F1"/>
    <circle cx="32" cy="40" r="4" fill="#FFFFFF"/>
    
    <rect x="58" y="50" width="24" height="24" rx="7" fill="url(#studioGrad)"/>
    <!-- Central AI Star Spark -->
    <path d="M70 54 L72.5 59 L78 60 L73.5 64 L75 70 L70 66 L65 70 L66.5 64 L62 60 L67.5 59 Z" fill="#FFFFFF"/>
    
    <rect x="80" y="70" width="20" height="20" rx="6" fill="#818CF8"/>
    <circle cx="90" cy="80" r="4" fill="#FFFFFF"/>
  </g>
</svg>
